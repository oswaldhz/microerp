services:
  db:
    image: postgres:16-alpine
    container_name: microerp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: microerp
      POSTGRES_PASSWORD: microerp
      POSTGRES_DB: microerp
    ports:
      - "5433:5432"
    volumes:
      - microerp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microerp -d microerp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  microerp_pgdata: